/* Chapter 5: compare surface coefficients at a glance on wide screens. */
.doc-content table.surface-table{display:table;table-layout:fixed;overflow:visible;width:100%;font-size:12px}
.surface-table th:nth-child(1),.surface-table td:nth-child(1){width:9%}
.surface-table th:nth-child(2),.surface-table td:nth-child(2){width:8%}
.surface-table th:nth-child(3),.surface-table td:nth-child(3),.surface-table th:nth-child(4),.surface-table td:nth-child(4),.surface-table th:nth-child(5),.surface-table td:nth-child(5),.surface-table th:nth-child(6),.surface-table td:nth-child(6),.surface-table th:nth-child(7),.surface-table td:nth-child(7),.surface-table th:nth-child(8),.surface-table td:nth-child(8){width:7%}
.surface-table th:nth-child(9),.surface-table td:nth-child(9){width:41%}
.surface-table td{min-width:0;overflow-wrap:anywhere}
.surface-table td:nth-child(-n+8){font-variant-numeric:tabular-nums}
@media(max-width:680px){
 .doc-content table.surface-table{display:block;overflow:visible;border-collapse:separate;border-spacing:0 12px;width:100%;font-size:14px}
 .surface-table thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
 .surface-table tbody,.surface-table tr{display:block;width:100%}
 .surface-table tr{margin:0 0 14px;padding:5px 14px;background:#fff;border:1px solid #c7cfce;border-radius:5px;box-shadow:0 3px 10px rgba(21,23,24,.05)}
 .surface-table td{display:grid;grid-template-columns:minmax(108px,38%) minmax(0,1fr);gap:12px;align-items:start;width:100%;min-width:0;padding:9px 0;border:0;border-bottom:1px solid #e8eceb;text-align:left;line-height:1.65}
 .surface-table td::before{content:attr(data-label);font-size:12px;font-weight:700;color:#687476}
 .surface-table td:last-child{display:block;border-bottom:0;padding-bottom:11px}
 .surface-table td:last-child::before{display:block;margin-bottom:3px}
}
