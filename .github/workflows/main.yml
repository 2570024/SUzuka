      <details class="doc-reader" id="reader-spec"><summary>仕様書 — 制御仕様書全文を読む</summary><article class="doc-content spec-content" id="spec-content"><h1>自動運転シミュレータ 制御仕様書</h1>
<p>自動運転シミュレータの<strong>運転制御に関する技術仕様</strong>をまとめた文書です。</p>
<ul>
<li><strong>人が読む場合</strong>：制御の設計に必要な入出力・物理挙動・コース・計測指標の正確な仕様を確認できます。</li>
<li><strong>生成AIに読み込ませる場合</strong>：この文書1つでシステム全体の前提を伝えられるように書かれています。
  「この仕様書に従って <code>controllers/your_controller.py</code> の <code>control(obs)</code> を改良して」のように依頼してください。</li>
</ul>
<blockquote>
<p>はじめて参加する人向けの導入・環境構築・上達のステップは、別紙「参加者ガイド.md」を参照してください（この添付には含まれていません）。</p>
</blockquote>
<hr />
<h2>1. システム概要</h2>
<p>見下ろし型2Dコースを走る自動運転制御を作るシミュレータです。
物理・描画・コース・計測はエンジン側で固定されており、<strong>参加者が書くのは運転制御ロジックだけ</strong>です。</p>
<h3>1.1 構成モジュール</h3>
<pre><code>intern/
├─ main.py                    # 起動・2分割同時走行・結果出力
├─ config.py                  # 全定数（物理・画面・計測・センサー）※本書の数値の出典
├─ engine/                    # エンジン（参加者は編集しない）
│   ├─ types.py               #   Car / Action / sanitize_action
│   ├─ physics.py             #   車両運動モデル（前輪操舵＋グリップ限界＋路面効果）
│   ├─ track.py               #   コース読込・走行可否・路面種別
│   ├─ sensors.py             #   Observation 生成（レイキャスト等）
│   ├─ runner.py              #   参加者コードの安全実行（例外・出力を隔離）
│   ├─ simulator.py           #   1台分の走行進行（CP通過・衝突・タイム集計）
│   └─ evaluator.py           #   フィードバック指標の算出
├─ render/view.py             # 描画
├─ courses/course_01/         # コースデータ（mask.png + meta.json）※本番コースは当日追加配布
└─ controllers/
    ├─ interface.py           # Observation / Action の定義と補助関数
    ├─ sample_controller.py   # 配布時の基準（編集せず比較用に残す）
    └─ your_controller.py     # ★参加者が編集するファイル
</code></pre>
<ul>
<li>依存の向き：<code>main → engine/render → controllers</code>。</li>
<li>制御はエンジン内部を知らず、毎フレーム渡される <code>Observation</code> を見て <code>Action</code> を返すだけです。</li>
</ul>
<h3>1.2 実行ループ</h3>
<ol>
<li>エンジンが現在の車両状態から <code>Observation</code> を生成する。</li>
<li>参加者の <code>control(obs)</code> が呼ばれ、<code>Action</code> を返す。</li>
<li>エンジンが物理モデルで車を1ステップ進め、衝突・CP通過・タイムを判定する。</li>
<li>上記を <strong>固定タイムステップ 1/60 秒</strong>（60 FPS）で繰り返す。PC性能に結果は依存しない。</li>
</ol>
<h3>1.3 実行方法</h3>
<pre><code class="language-bash"># 左ビュー=第1引数, 右ビュー=第2引数 の制御で同時走行
python main.py sample_controller your_controller --course course_01
</code></pre>
<ul>
<li>制御名は <code>controllers/</code> 内のモジュール名（<code>.py</code> を除いたファイル名）。</li>
<li>ファイルを好きな名前でコピーすればその名前の制御として走らせられる（比較用）。</li>
<li>オプション：<code>--course コース名</code>、<code>--fast</code>（描画ペーシング省略）、<code>--max-frames N</code>（打ち切り）。</li>
</ul>
<hr />
<h2>2. 座標系・単位系</h2>
<table>
<thead>
<tr>
<th>項目</th>
<th>定義</th>
</tr>
</thead>
<tbody>
<tr>
<td>距離</td>
<td>ピクセル [px]</td>
</tr>
<tr>
<td>時間</td>
<td>秒 [s]。1フレーム = <code>dt</code> = 1/60 s（固定）</td>
</tr>
<tr>
<td>角度</td>
<td>ラジアン [rad]</td>
</tr>
<tr>
<td>原点</td>
<td>画面左上。x は右向きが正、<strong>y は下向きが正</strong></td>
</tr>
<tr>
<td>向き <code>heading</code></td>
<td>+x 方向 = 0。y が下向きのため<strong>時計回りが正</strong></td>
</tr>
<tr>
<td>相対方位</td>
<td><code>bearing_to()</code> の返り値は <strong>正=右前方 / 0=正面 / 負=左前方</strong></td>
</tr>
</tbody>
</table>
<hr />
<h2>3. 制御インターフェース</h2>
<h3>3.1 control() の契約</h3>
<p>参加者は <code>controllers/your_controller.py</code> に次の関数を1つ定義します：</p>
<pre><code class="language-python">from controllers.interface import Action, Observation, bearing_to, distance_to

def control(obs: Observation) -&gt; Action:
    ...
    return Action(steer=..., accel=..., brake=...)
</code></pre>
<ul>
<li>毎フレーム（60回/秒）呼ばれる。<strong>重い計算を書くと実時間の走行に影響する</strong>ため禁止。</li>
<li>返り値は <code>Action</code>。それ以外の型を返すと、そのフレームは <code>Action(0,0,0)</code>（何もしない）扱い。</li>
</ul>
<h3>3.2 入力：Observation（frozen dataclass）</h3>
<table>
<thead>
<tr>
<th>フィールド</th>
<th>型</th>
<th>意味</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>speed</code></td>
<td>float</td>
<td>現在の速さ [px/s]（0 〜 最高速度 420）</td>
</tr>
<tr>
<td><code>pos</code></td>
<td>(float, float)</td>
<td>自車の絶対座標 (x, y) [px]</td>
</tr>
<tr>
<td><code>heading</code></td>
<td>float</td>
<td>自車の向き [rad]（第2章の座標系に従う）</td>
</tr>
<tr>
<td><code>next_cp</code></td>
<td>(float, float)</td>
<td><strong>次に通るチェックポイント</strong>の絶対座標。通過するたび次の1個へ更新。最後のCP＝ゴール</td>
</tr>
<tr>
<td><code>rays</code></td>
<td>dict[str, float]</td>
<td>各方向の壁までの距離 [px]（第6章）</td>
</tr>
<tr>
<td><code>surface</code></td>
<td>str</td>
<td>いま踏んでいる路面：<code>'road'</code> / <code>'ice'</code> / <code>'mud'</code> / <code>'boost'</code>（第5章）</td>
</tr>
<tr>
<td><code>progress</code></td>
<td>float</td>
<td>進捗 0.0〜1.0（規定周回分を含む全体進捗。参考・デバッグ用）</td>
</tr>
<tr>
<td><code>dt</code></td>
<td>float</td>
<td>このフレームの時間 [s]（= 1/60）</td>
</tr>
</tbody>
</table>
<p><strong>重要な設計思想（カーナビ型）</strong>：中心線をなぞる「答え」は渡されません。
<code>next_cp</code> は目的地を示すだけで、<strong>連続するCPの直線上には必ず壁（コースの曲線）があります</strong>。
壁センサー <code>rays</code> で「道なり」に走りながら <code>next_cp</code> の方向へ向かうのが基本形です。</p>
<h3>3.3 補助関数（controllers/interface.py）</h3>
<pre><code class="language-python">bearing_to(obs, point)   # point=(x,y) の相対方位 [rad]。正=右, 負=左, 0=正面
distance_to(obs, point)  # point までの直線距離 [px]
</code></pre>
<h3>3.4 出力：Action（frozen dataclass）</h3>
<table>
<thead>
<tr>
<th>フィールド</th>
<th>範囲</th>
<th>意味</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>steer</code></td>
<td>-1.0 〜 1.0</td>
<td>ステアリング。<strong>負=左, 正=右</strong>。前輪切れ角 = <code>steer × 0.60</code> [rad]</td>
</tr>
<tr>
<td><code>accel</code></td>
<td>0.0 〜 1.0</td>
<td>アクセル開度</td>
</tr>
<tr>
<td><code>brake</code></td>
<td>0.0 〜 1.0</td>
<td>ブレーキ踏力</td>
</tr>
</tbody>
</table>
<ul>
<li><code>accel</code> と <code>brake</code> を同時に出すことは可能（駆動と制動が打ち消し合う）。</li>
</ul>
<h3>3.5 異常時の扱い（安全装置）</h3>
<table>
<thead>
<tr>
<th>ケース</th>
<th>エンジンの挙動</th>
</tr>
</thead>
<tbody>
<tr>
<td>範囲外の値 / NaN / None / 数値以外</td>
<td>自動補正（クランプまたは 0.0 に置換）。車は壊れない</td>
</tr>
<tr>
<td><code>control()</code> が例外を送出</td>
<td>そのフレームは <code>Action(0,0,0)</code>（惰性走行）。例外回数は記録され結果に表示される</td>
</tr>
<tr>
<td>返り値が <code>Action</code> 以外</td>
<td>同上（<code>Action(0,0,0)</code> 扱い＋記録）</td>
</tr>
</tbody>
</table>
<h3>3.6 状態の保持</h3>
<p><code>control()</code> は関数1つですが、モジュールのグローバル変数に前フレームの情報などを保持できます
（例：スタック検出用のタイマー）。ただし<strong>同じ制御名を左右両方に指定すると状態が共有される</strong>点に注意。</p>
<hr />
<h2>4. 車両物理モデル</h2>
<p>前輪操舵のキネマティック車両モデル＋グリップ限界。毎フレーム以下の順で計算されます
（実装：<code>engine/physics.py</code>）。<code>surf</code> は足元の路面効果（第5章）。</p>
<h3>4.1 縦方向（加速・制動・抵抗）</h3>
<pre><code>drive   = accel × 260 × surf.accel + surf.boost     # 駆動 [px/s²]
braking = brake × 520 × surf.brake                  # 制動 [px/s²]
drag    = 0.8 × surf.drag × v                       # 速度比例の抵抗 [px/s²]
v_next  = clamp(v + (drive − braking − drag) × dt,  0,  420 × surf.vmax)
</code></pre>
<h3>4.2 操舵（前輪切れ角 → 回頭）</h3>
<pre><code>delta    = steer × 0.60                             # 前輪切れ角 [rad]
yaw_rate = (v / 32) × tan(delta)                    # 回頭角速度 [rad/s]（32=ホイールベース）
</code></pre>
<p>速度が 0 だと回頭できない（＝止まったままハンドルを切っても向きは変わらない）。</p>
<h3>4.3 グリップ限界（滑り）</h3>
<p>必要な向心加速度が限界を超えると、曲がりきれずに滑ります：</p>
<pre><code>a_lat = v × yaw_rate                                # 要求向心加速度 [px/s²]
if |a_lat| &gt; 900 × surf.grip:
    yaw_rate ×= (900 × surf.grip) / |a_lat|         # 回頭が制限され外へ膨らむ
    v ×= 0.98                                       # わずかに減速（スクラブ）
</code></pre>
<h3>4.4 位置・向きの更新</h3>
<pre><code>theta_next = normalize(theta + yaw_rate × dt)       # -π〜π に正規化
x_next     = x + v × cos(theta) × dt
y_next     = y + v × sin(theta) × dt
</code></pre>
<h3>4.5 物理定数一覧（config.py）</h3>
<table>
<thead>
<tr>
<th>定数</th>
<th>値</th>
<th>意味</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DT</code></td>
<td>1/60 s</td>
<td>固定タイムステップ</td>
</tr>
<tr>
<td><code>V_MAX</code></td>
<td>420 px/s</td>
<td>最高速度</td>
</tr>
<tr>
<td><code>ENGINE_ACCEL</code></td>
<td>260 px/s²</td>
<td>アクセル全開時の駆動加速度</td>
</tr>
<tr>
<td><code>BRAKE_DECEL</code></td>
<td>520 px/s²</td>
<td>ブレーキ全開時の制動減速度</td>
</tr>
<tr>
<td><code>DRAG</code></td>
<td>0.8 /s</td>
<td>速度比例の抵抗係数</td>
</tr>
<tr>
<td><code>WHEELBASE</code></td>
<td>32 px</td>
<td>ホイールベース</td>
</tr>
<tr>
<td><code>MAX_STEER_ANGLE</code></td>
<td>0.60 rad</td>
<td>前輪の最大切れ角（約34°）</td>
</tr>
<tr>
<td><code>A_LAT_MAX</code></td>
<td>900 px/s²</td>
<td>グリップ限界（最大向心加速度）</td>
</tr>
<tr>
<td><code>GRIP_LOSS</code></td>
<td>0.98</td>
<td>滑り時の減速係数</td>
</tr>
</tbody>
</table>
<h3>4.6 導出値（制御設計の目安）</h3>
<p>定数から導かれる、設計に役立つ数値です：</p>
<table>
<thead>
<tr>
<th>目安</th>
<th>値</th>
<th>導出</th>
</tr>
</thead>
<tbody>
<tr>
<td>最小旋回半径</td>
<td>約 47 px</td>
<td><code>32 / tan(0.60)</code>（フルステア時）</td>
</tr>
<tr>
<td>フルステアで曲がりきれる限界速度（通常路面）</td>
<td>約 205 px/s</td>
<td><code>√(900 × 47)</code></td>
</tr>
<tr>
<td>同・アイス上（grip 0.42）</td>
<td>約 133 px/s</td>
<td><code>√(900 × 0.42 × 47)</code></td>
</tr>
<tr>
<td>通常路面の実質最高速度</td>
<td>約 325 px/s</td>
<td>駆動と抵抗の釣り合い <code>260 / 0.8</code>（420 には抵抗のため届かない）</td>
</tr>
<tr>
<td>制動距離（300 px/s → 0、ブレーキ全開）</td>
<td>約 87 px</td>
<td><code>v² / (2 × 520)</code>（抵抗の分さらに短くなる）</td>
</tr>
<tr>
<td>旋回半径と速度の関係</td>
<td><code>v ≤ √(900 × grip × R)</code></td>
<td>半径 R で曲がるには速度をこれ以下に</td>
</tr>
</tbody>
</table>
<p><strong>含意</strong>：前方レイの最大探知距離は 260 px（第6章）なので、壁を検知してからフルブレーキ
すれば約 325 px/s からでも止まれる計算ですが、判断が1フレーム遅れるごとに約 5 px 進みます。
「前方の壁までの距離に比例した目標速度」が有効な理由がここにあります。</p>
<hr />
<h2>5. 路面サーフェス</h2>
<p>コース上の色つき領域は物理係数を倍率で変化させます。現在踏んでいる種別は <code>obs.surface</code> で分かります。</p>
<table class="surface-table" aria-label="路面ごとの物理係数一覧">
<thead>
<tr>
<th>surface</th>
<th>見た目</th>
<th>grip</th>
<th>accel</th>
<th>brake</th>
<th>drag</th>
<th>vmax</th>
<th>boost</th>
<th>挙動の要約</th>
</tr>
</thead>
<tbody>
<tr><td data-label="路面 (surface)"><code>road</code></td><td data-label="見た目">通常</td><td data-label="grip">1.00</td><td data-label="accel">1.00</td><td data-label="brake">1.00</td><td data-label="drag">1.0</td><td data-label="vmax">1.00</td><td data-label="boost">0</td><td data-label="挙動の要約">基準</td></tr>
<tr><td data-label="路面 (surface)"><code>ice</code></td><td data-label="見た目">水色</td><td data-label="grip"><strong>0.42</strong></td><td data-label="accel">0.80</td><td data-label="brake"><strong>0.50</strong></td><td data-label="drag">0.35</td><td data-label="vmax">1.00</td><td data-label="boost">0</td><td data-label="挙動の要約"><strong>滑る</strong>。曲がれる限界速度が約65%に低下、ブレーキも半分しか効かない → 進入前に減速</td></tr>
<tr><td data-label="路面 (surface)"><code>mud</code></td><td data-label="見た目">茶色</td><td data-label="grip">0.85</td><td data-label="accel"><strong>0.55</strong></td><td data-label="brake">1.10</td><td data-label="drag"><strong>3.2</strong></td><td data-label="vmax">0.60</td><td data-label="boost">0</td><td data-label="挙動の要約"><strong>失速する</strong>。抵抗が非常に大きく巡航速度は約56 px/s まで低下 → アクセル全開で押し切る</td></tr>
<tr><td data-label="路面 (surface)"><code>boost</code></td><td data-label="見た目">黄色</td><td data-label="grip">1.00</td><td data-label="accel">1.00</td><td data-label="brake">1.00</td><td data-label="drag">1.0</td><td data-label="vmax"><strong>1.40</strong></td><td data-label="boost"><strong>+360 px/s²</strong></td><td data-label="挙動の要約"><strong>加速する</strong>。上限588 px/s まで伸びる → 直後のコーナーで速度超過に注意</td></tr>
</tbody>
<ul>
<li>倍率の適用式は第4章を参照（例：アイス上のグリップ限界 = <code>900 × 0.42</code>）。</li>
<li>効果は<strong>車の中心座標が領域内にある間だけ</strong>適用されます。</li>
</ul>
<hr />
<h2>6. センサー（レイキャスト）</h2>
<p>車の中心から各方向へレイを飛ばし、<strong>壁（走行不可領域）に当たるまでの距離 [px]</strong> を返します。
<code>obs.rays</code> は次の5方向の dict です：</p>
<table>
<thead>
<tr>
<th>キー</th>
<th>車体前方を0とした角度</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>'front'</code></td>
<td>0°（真正面）</td>
</tr>
<tr>
<td><code>'front_left'</code></td>
<td>−30°</td>
</tr>
<tr>
<td><code>'front_right'</code></td>
<td>+30°</td>
</tr>
<tr>
<td><code>'left'</code></td>
<td>−90°（真左）</td>
</tr>
<tr>
<td><code>'right'</code></td>
<td>+90°（真右）</td>
</tr>
</tbody>
</table>
<ul>
<li>最大探知距離 <strong>260 px</strong>（それ以上開けていても 260 が返る）。</li>
<li>探索刻みは 4 px（距離の分解能）。</li>
<li><strong>閉じている周回連動ゲート（第8.3節）も壁として検出される</strong>。
  つまり「レイに映る＝物理的にも通れない」で一貫している。</li>
</ul>
<p>典型的な使い方：</p>
<pre><code class="language-python">obs.rays['front'] が小さい      → カーブ・行き止まりが近い → 減速
front_left − front_right の差   → 道が開いている方向 → その方向へ操舵（道なり走行）
left / right が小さい           → 壁に寄りすぎ → 反対側へ補正
</code></pre>
<hr />
<h2>7. 壁衝突</h2>
<p>車の中心が走行不可領域に入ろうとしたフレームの挙動（実装：<code>engine/simulator.py</code>）：</p>
<ol>
<li>位置は更新されない（押し戻し）。ただし<strong>向きの変化は反映される</strong>
   （壁に正対して停止しても、ハンドルを切りながら加速すれば回頭して脱出できる）。</li>
<li>速度が <strong>30% に低下</strong>する（<code>WALL_SPEED_FACTOR = 0.30</code>）。</li>
<li>衝突カウント <strong>+1</strong>（タイムペナルティ <strong>+2秒</strong>）。
   壁に触れ続けている間は1回と数え、離れて再度当たると次の1回になる。</li>
</ol>
<hr />
<h2>8. コースと進行</h2>
<h3>8.1 コースの構成要素</h3>
<p>各コースは <code>courses/&lt;name&gt;/</code> の2ファイルで定義されます：</p>
<ul>
<li><code>mask.png</code> … 白=走行可能 / 黒=壁 のビットマップ（コース形状そのもの）</li>
<li><code>meta.json</code> … チェックポイント座標列・スタート位置と向き・周回フラグ・特殊路面領域（zones）</li>
</ul>
<h3>8.2 チェックポイント（CP）と完走判定</h3>
<table>
<thead>
<tr>
<th>項目</th>
<th>仕様</th>
</tr>
</thead>
<tbody>
<tr>
<td>通過判定</td>
<td>CP座標との距離が <strong>45 px 未満</strong>になったフレームで通過</td>
</tr>
<tr>
<td>通過順序</td>
<td>順番固定。<code>obs.next_cp</code> は常に「次に通るべき1個」を指す</td>
</tr>
<tr>
<td>周回コース</td>
<td>CP0 = スタート地点。<strong>3周</strong>（CP数 × 3 個の関門を順に通過）で完走</td>
</tr>
<tr>
<td>非周回コース</td>
<td>最後のCP = ゴール地点。1回到達で完走</td>
</tr>
<tr>
<td>制限時間</td>
<td><strong>180 秒</strong>。超えると走行打ち切り（DNF）</td>
</tr>
<tr>
<td>CPの数</td>
<td>各コース2〜5個程度と少ない。<strong>CP間の直線上には必ず壁がある</strong>（CPは目的地であって経路ではない）</td>
</tr>
</tbody>
</table>
<h3>8.3 周回連動ゲート（本番コースの一部に登場）</h3>
<ul>
<li><code>meta.json</code> の zones に <code>type="gate"</code> として定義される<strong>周回によって開閉する壁</strong>。</li>
<li><code>(lap − 1) % period == open_phase</code> の周だけ通行可能（既定 period=2 ＝1周おきに交互）。</li>
<li>閉じている間は<strong>物理（衝突）とセンサー（レイ）の両方で壁</strong>として扱われる。
  → 「開いている道なりに走る」制御なら特別な対応は不要。</li>
<li>画面表示：赤=閉（壁）、緑の枠=開。</li>
</ul>
<h3>8.4 コース一覧</h3>
<p>配布物に含まれるコースは <strong>course_01</strong> のみです。本番用のコースは当日順次配布されます。</p>
<table>
<thead>
<tr>
<th>コース</th>
<th>周回</th>
<th>難易度</th>
<th>特徴</th>
</tr>
</thead>
<tbody>
<tr>
<td>course_01</td>
<td>3周</td>
<td>初級</td>
<td>スタジアム型（長い直線＋両端の半円）。固定幅。特殊路面（ice / mud / boost）が各1か所ずつある</td>
</tr>
</tbody>
</table>
<ul>
<li>本番コースには、幅が不定の区間（広い/狭い）、<strong>行き止まり</strong>（目的地方向へ最短で突っ込むと
  袋小路に入る分かれ道）、周回連動ゲート（第8.3節）などの<strong>追加の仕掛け</strong>が登場することがあります。
  「目的地の方向へ向かうだけ」の制御はハマるため、レイで開いている道を選ぶ判断が必要です。</li>
</ul>
<hr />
<h2>9. 走行結果の指標</h2>
<p>走行終了時に結果出力へ表示される計測値です。どの指標を重視するか＝何を目標とするかの
設定は自由です：</p>
<table>
<thead>
<tr>
<th>指標</th>
<th>定義</th>
</tr>
</thead>
<tbody>
<tr>
<td>衝突回数 <code>crashes</code></td>
<td>壁衝突イベントの回数</td>
</tr>
<tr>
<td>平均速度 <code>avg_v</code></td>
<td>全フレームの速度平均</td>
</tr>
<tr>
<td>滑らかさ <code>smooth</code></td>
<td>ステア変化量の1フレーム平均（小さいほど滑らか）</td>
</tr>
<tr>
<td>区間タイム <code>cp_times</code></td>
<td>各CP到達時刻（一部区間だけ遅くないか＝全体最適の分析用）</td>
</tr>
<tr>
<td>エラー回数 <code>errors</code></td>
<td><code>control()</code> の例外・不正返り値の回数</td>
</tr>
</tbody>
</table>
<hr />
<h2>10. 制約事項</h2>
<ul>
<li><strong>編集してよいのは <code>controllers/</code> 内のファイルだけ</strong>。<code>engine/</code>・<code>render/</code>・<code>config.py</code>・
  <code>courses/</code> は変更禁止（変更しても本番環境では反映されない）。</li>
<li><code>sample_controller.py</code> は「改良前の基準」として<strong>編集せず残す</strong>（並走比較に使う）。</li>
<li><code>control()</code> 内の重い処理（大きなループ、ファイルI/O、外部通信など）は禁止。
  毎秒60回呼ばれるため、実時間の走行に直接影響する。</li>
<li>外部ライブラリの追加インストールは不可（標準ライブラリ＋既存環境のみ。<code>math</code> は自由に使える）。</li>
</ul></article></details>
