f;font-size:13px}.contact-panel .button{margin:22px 0}.contact-meta{border-top:1px solid rgba(21,23,24,.25);padding-top:18px;color:#695813;font-size:11px;line-height:1.8}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:25px 8vw;background:var(--dark);color:#889596;font-size:10px;letter-spacing:.09em}footer .brand{color:#fff}footer a{text-decoration:none}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--ink);color:white;animation:leave .6s 1s forwards}.loader span{font-size:13px;letter-spacing:.2em}.loader i{position:absolute;width:100px;height:1px;background:var(--yellow);bottom:37%;animation:load .9s ease-in-out infinite}@keyframes load{0%{transform:scaleX(.1);opacity:.3}50%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.1);opacity:.3}}@keyframes leave{to{opacity:0;visibility:hidden;transform:translateY(-5%)}}@media(max-width:900px){.hero{grid-template-columns:1fr 1fr;gap:5vw}.section{padding-left:6vw;padding-right:6vw}.media-layout{gap:5vw}.course-grid{grid-template-columns:1fr 190px}}@media(max-width:680px){.header{padding:0 7vw}.nav{display:none}.nav.open{display:flex;position:absolute;right:7vw;top:64px;align-items:stretch;flex-direction:column;gap:18px;padding:20px;background:var(--paper);box-shadow:0 12px 30px rgba(0,0,0,.12)}.header-cta{display:none}.menu-toggle{display:block}.section{padding:120px 7vw 75px}.hero,.media-layout,.contact-section{grid-template-columns:1fr;gap:55px}.hero h1,h2{font-size:clamp(48px,14vw,75px)}.course-preview{width:100%}.trust{margin-top:40px}.split-heading,.section-head,.docs-head{display:block}.split-heading>p,.section-head>p,.docs-head>p{margin-top:25px}.course-grid{grid-template-columns:1fr;margin-top:45px}.large-image img{height:auto}.fact-stack .button{width:max-content}.info-grid{grid-template-columns:1fr}.info-grid article{min-height:0}.info-grid h3{margin-top:38px}.video-placeholder{height:240px}.doc-list a{grid-template-columns:1fr 24px;g